[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-tracker"
version = "0.1.0"
description = "Safe ESP32-CAM and pan tilt visual tracking prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.24",
  "opencv-python>=4.8,<5",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
  "requests>=2.31",
  "ultralytics>=8.3",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
face = [
  "insightface>=0.7.3",
  "onnxruntime>=1.19"
]
dev = [
  "httpx>=0.27",
  "playwright>=1.45",
  "pytest>=8.0"
]

[project.scripts]
drone-tracker = "drone_tracker.cli:main"
drone-calibrate = "drone_tracker.calibrate_cli:main"
drone-smoke-yolo = "drone_tracker.smoke_yolo:main"
drone-tracker-gui = "drone_tracker.gui.app:main"
drone-inference-server = "drone_tracker.inference_server:main"

[tool.setuptools.packages.find]
where = ["mac_tracker"]

[tool.setuptools.package-data]
drone_tracker = ["gui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mac_tracker"]
