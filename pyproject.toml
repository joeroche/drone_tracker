[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-tracker"
version = "0.2.0"
description = "Single-ESP32-CAM Grounding DINO and KLT pan-tilt tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "Pillow>=10,<13",
  "torch>=2.4,<3",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
drone-tracker = "drone_tracker.app:main"
drone-tracker-download-model = "drone_tracker.download_model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drone_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
