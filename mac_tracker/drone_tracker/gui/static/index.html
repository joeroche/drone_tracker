<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trifold Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>Trifold Tracker</h1>
            <p id="bootLine">awaiting boot sequence</p>
          </div>
        </div>
        <div class="mode-switch" role="tablist" aria-label="Tracking mode">
          <button class="mode active" data-mode="drone">Drone</button>
          <button class="mode" data-mode="face">Face</button>
          <button class="mode" data-mode="object">Object</button>
        </div>
      </header>

      <section class="grid">
        <section class="video-panel">
          <div class="video-frame">
            <img id="video" src="/api/video.mjpg" alt="Live annotated tracker video">
            <div id="overlayState" class="overlay-state">stream idle</div>
          </div>
          <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resumeBtn">Resume</button>
            <button id="stopBtn">Stop</button>
            <button id="centerBtn">Center</button>
            <label class="toggle"><input id="dryRunToggle" type="checkbox" checked> Dry run</label>
          </div>
        </section>

        <aside class="status-rail">
          <h2>Status</h2>
          <dl>
            <div><dt>Mode</dt><dd id="sMode">drone</dd></div>
            <div><dt>Camera</dt><dd id="sCamera">idle</dd></div>
            <div><dt>Model</dt><dd id="sModel">idle</dd></div>
            <div><dt>Profile</dt><dd id="sProfile">none</dd></div>
            <div><dt>Track</dt><dd id="sTrack">idle</dd></div>
            <div><dt>Controller</dt><dd id="sController">dry_run</dd></div>
            <div><dt>Lock LED</dt><dd id="sLock">off</dd></div>
            <div><dt>Pan/Tilt</dt><dd id="sMotion">90.0 / 90.0</dd></div>
          </dl>
        </aside>
      </section>

      <section id="enrollPanel" class="enroll hidden">
        <div class="enroll-head">
          <h2 id="enrollTitle">Enrollment</h2>
          <p id="enrollHint">Build a local target profile from photos.</p>
        </div>
        <div class="enroll-form">
          <input id="profileName" placeholder="Profile name">
          <input id="directory" placeholder="/absolute/path/to/photos">
          <input id="prompt" placeholder="Object prompt, for example Coca-Cola can">
          <button id="enrollBtn">Enroll</button>
        </div>
        <div id="reviewSummary" class="review-summary">No enrollment job loaded.</div>
        <div id="reviewGrid" class="review-grid"></div>
      </section>

      <section class="log-panel">
        <div class="log-head">
          <h2>Event Log</h2>
          <span id="targetBadge">target unknown</span>
        </div>
        <pre id="logs"></pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
